<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upstream App — LocalNetwork Proxy Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f1117;
            color: #e4e6f0;
            display: grid;
            place-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
        }
        .card {
            background: #1a1d27;
            border: 1px solid #2d3245;
            border-radius: 12px;
            padding: 48px;
            max-width: 480px;
        }
        h1 { font-size: 2rem; margin-bottom: 12px; color: #6366f1; }
        p { color: #8b90a5; font-size: 1.1rem; line-height: 1.6; }
        .badge {
            display: inline-block;
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.85rem;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Upstream App</h1>
        <p>This page is served by the LocalNetwork reverse proxy. The proxy forwards requests to this nginx backend based on the routing rules in proxy.yaml.</p>
        <span class="badge">Proxied by LocalNetwork</span>
    </div>
</body>
</html>
